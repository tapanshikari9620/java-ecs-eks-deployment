apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-demo-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-demo-app
  template:
    metadata:
      labels:
        app: java-demo-app
    spec:
      containers:
        - name: java-demo-app
          image: YOUR_ECR_IMAGE
          ports:
            - containerPort: 8080
